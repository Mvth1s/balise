packages:
  - apps/*
  - packages/*

# Never install a version published less than 14 days ago (in minutes).
minimumReleaseAge: 20160

# Dependencies allowed to run install scripts.
allowBuilds:
  esbuild: true

# Security fixes of transitive dependencies (GHSA-mrhx-c7xc-m3w5: zod < 4.6.6,
# via @vercel/functions > @vercel/oidc > @vercel/cli-config).
overrides:
  '@vercel/cli-config>zod': 4.6.7
