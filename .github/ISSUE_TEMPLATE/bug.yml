name: Bogue
description: Signaler un comportement incorrect de Balise (analyse, rapport, interface, API).
title: '[Bogue] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler ce problème. Pour une vulnérabilité, n'utilisez pas ce formulaire : consultez SECURITY.md.
        Un problème d'accessibilité de l'interface de Balise ? Utilisez plutôt le modèle « Accessibilité de Balise ».
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que se passe-t-il ?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      description: Décrivez les actions effectuées, une par ligne.
      placeholder: |
        1. Saisir l'URL …
        2. Cliquer sur « Analyser la page »
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Résultat attendu
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Résultat obtenu
      description: Message d'erreur, capture d'écran ou lien vers le rapport concerné.
    validations:
      required: true
  - type: input
    id: analyzed-url
    attributes:
      label: URL analysée (facultatif)
      description: Uniquement si elle est publique et qu'elle ne contient aucune donnée personnelle.
  - type: input
    id: environment
    attributes:
      label: Environnement
      description: Navigateur et version, système, technologie d'assistance éventuelle.
      placeholder: Firefox 140, Windows 11, NVDA 2026.1
  - type: textarea
    id: context
    attributes:
      label: Informations complémentaires
